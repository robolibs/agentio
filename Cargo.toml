[package]
name = "agentio"
version = "0.1.0"
edition = "2024"
authors = ["Trim Bresilla <trim.bresilla@gmail.com>"]
description = "Agent IO interface and agent composition crate on top of peerbus"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"
# `rlib` for Rust use; `cdylib` for the Python extension module
# (`--features python`, built by maturin).
crate-type = ["rlib", "cdylib"]

[features]
# Python bindings (pyo3). Builds the cdylib as a CPython extension.
python = ["dep:pyo3", "peerbus/python"]

[profile.python]
inherits = "dev"

[dependencies]
peerbus = { git = "https://codeberg.org/robolibs/peerbus.git", rev = "8aec5611fdf3f0bf5fcdd969c8d96d2f66745cb4" }
authbox = { git = "https://codeberg.org/robolibs/authbox.git", tag = "0.1.1" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.6.0" }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", default-features = false, features = ["use-std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2.0"
tracing = "0.1"
pyo3 = { version = "0.23", optional = true, features = ["abi3-py311", "extension-module"] }

[dev-dependencies]
agentio-example-messages = { path = "examples/rust/shared_types" }
blake3 = { version = "1", default-features = false }
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "01_single_machine"
path = "examples/rust/01_single_machine.rs"

[[example]]
name = "02_referral_resolution"
path = "examples/rust/02_referral_resolution.rs"

[[example]]
name = "03_req_res_service"
path = "examples/rust/03_req_res_service.rs"

[[example]]
name = "04_by_id_escape"
path = "examples/rust/04_by_id_escape.rs"

[[example]]
name = "05_all_exchanges"
path = "examples/rust/05_all_exchanges.rs"

[[example]]
name = "06_server_all"
path = "examples/rust/06_server_all.rs"

[[example]]
name = "07_client_all"
path = "examples/rust/07_client_all.rs"

[[example]]
name = "08_heavy_server"
path = "examples/rust/08_heavy_server.rs"

[[example]]
name = "09_heavy_client"
path = "examples/rust/09_heavy_client.rs"

[[example]]
name = "10_camera_publisher"
path = "examples/rust/10_camera_publisher.rs"

[[example]]
name = "11_camera_subscriber"
path = "examples/rust/11_camera_subscriber.rs"
