[package]
name = "agentio"
version = "0.1.0"
edition = "2024"
authors = ["Trim Bresilla <trim.bresilla@gmail.com>"]
description = "Agent IO interface and agent composition crate on top of peerbus"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"
# `rlib` for Rust use; `cdylib` for the Python extension module
# (`--features python`, built by maturin).
crate-type = ["rlib", "cdylib"]

[features]
# Python bindings (pyo3). Builds the cdylib as a CPython extension.
python = ["dep:pyo3", "peerbus/python"]

[profile.python]
inherits = "dev"

[dependencies]
peerbus = { git = "https://codeberg.org/robolibs/peerbus.git", rev = "8e91c6834d1d898b4a1c3b1477827dae1afa6c70" }
authbox = { git = "https://codeberg.org/robolibs/authbox.git", tag = "0.1.1" }
datapod = { git = "https://codeberg.org/robolibs/datapod.git", tag = "0.4.1" }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", default-features = false, features = ["use-std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2.0"
tracing = "0.1"
pyo3 = { version = "0.23", optional = true, features = ["abi3-py311", "extension-module"] }

[dev-dependencies]
agentio-example-messages = { path = "examples/shared_types" }
blake3 = { version = "1", default-features = false }
tempfile = "3.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
