[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "agentio"
version = "0.1.0"
description = "Python bindings for agentio: named agents, identity and directory resolution on peerbus"
requires-python = ">=3.11"

[tool.maturin]
features = ["python"]
module-name = "agentio"
profile = "python"
